<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fechamento Contábil NN</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<div id="demo" class="demo" hidden>
  <span><strong>Modo demonstração:</strong> os dados vêm da planilha e as alterações ficam salvas só neste navegador.</span>
  <button type="button" id="restaurar">Restaurar dados da planilha</button>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">NN</div><div><strong>NN HUB</strong><span>Contábil</span></div></div>
    <div class="slabel">Departamentos</div>
    <div class="snav"><span>Societário</span><span class="on">Contábil</span><span>Fiscal</span><span>DP</span><span>BPO</span></div>
    <div class="slabel">Contábil</div>
    <div class="snav"><span class="on">Fechamento contábil</span><span>Carteiras</span><span>AC Docs</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <h1>Fechamento contábil</h1>
      <div class="quem" id="quem"><label for="eu">Você é</label><select id="eu"></select></div>
      <div class="seg" id="escopo"><button type="button" data-v="todas" class="on">Todas as empresas</button><button type="button" data-v="minha">Minha carteira</button></div>
      <div style="position:relative">
        <button type="button" class="bell" id="bell" aria-haspopup="true">Avisos <b id="bellN">0</b></button>
        <div class="pop" id="pop" hidden></div>
      </div>
    </header>
    <main class="view">
      <nav class="tabs" id="tabs">
        <button type="button" data-t="empresas" class="on">Empresas</button>
        <button type="button" data-t="painel" hidden>Painel da coordenação</button>
        <button type="button" data-t="especiais">Transferidas e baixadas</button>
        <button type="button" data-t="regime">Mudanças de regime</button>
        <button type="button" data-t="historico">Histórico</button>
      </nav>
      <div id="content"><div class="empty"><strong>Carregando empresas…</strong>A lista do fechamento aparece aqui em instantes.</div></div>
    </main>
  </div>
</div>
<div id="drawerRoot"></div>
<div id="toast" class="toast" hidden></div>

<script src="shared/regras-fechamento.js"></script>
<script src="shared/permissoes.js"></script>
<script src="shared/servico-fechamento.js"></script>
<script src="js/repositorio-demo.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
